[project]
name = "gms-clinical-ai"
version = "2.0.0"
description = "Local-first clinical intelligence platform: patient records, hybrid RAG, evidence-grounded AI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.11",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10.4",
  "pydicom>=2.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
# In-process embedding / reranking models (sentence-transformers + torch). Optional:
# the same roles can be served by Ollama or any OpenAI-compatible endpoint instead.
local-models = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM105"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
