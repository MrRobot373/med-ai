[project]
name = "gms-clinical-ai-backend"
version = "0.1.0"
description = "GMS Clinical AI — local-first multimodal clinical RAG & decision-support backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "pydicom>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# RAG-stage dependencies land in Phase 07; declared here early per §11 so the
# embedding-health check in Phase 01 can optionally exercise them if installed.
rag = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "transformers>=4.46",
]
# OCR is optional/degradable, same pattern as embedding/reranker in Phase 01: ingestion
# reports an honest "OCR unavailable" status rather than failing hard if this isn't
# installed. easyocr substitutes for the spec's suggested PaddleOCR (spec §11 "PaddleOCR
# or another appropriate local open-source OCR engine") — PaddlePaddle's Windows wheel
# support has been unreliable, while easyocr is pip-only and reuses the torch install
# already required for the rag extra.
ocr = [
    "easyocr>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
