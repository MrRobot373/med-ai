[project]
name = "gms-clinical-ai-backend"
version = "0.1.0"
description = "GMS Clinical AI — local-first multimodal clinical RAG & decision-support backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# RAG-stage dependencies land in Phase 07; declared here early per §11 so the
# embedding-health check in Phase 01 can optionally exercise them if installed.
rag = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "transformers>=4.46",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
