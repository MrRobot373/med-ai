services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: gms-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST/gRPC-gateway API used by app.integrations.qdrant_client
      - "6334:6334" # native gRPC
    volumes:
      - ./docker/qdrant/storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Research Mode's optional self-hosted general search (spec §65). Off unless the
  # `research` profile is explicitly requested: `docker compose --profile research up`.
  # Configured fully in Phase 11 — this reserves the service shape now.
  searxng:
    image: searxng/searxng:latest
    container_name: gms-searxng
    restart: unless-stopped
    profiles: ["research"]
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng
