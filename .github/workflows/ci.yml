# Runs on every push and pull request; builds the delivery bundle on a version tag.
name: CI
on:
  push: { branches: ["**"], tags: ["v*"] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff && pip install --no-deps -e .
      - run: ruff check app tests && ruff format --check app tests
      - run: python -m pytest -q
      - name: Migrations are in step with the models
        run: DATA_DIR=$RUNNER_TEMP/m DATABASE_URL=sqlite:///$RUNNER_TEMP/m/g.db sh -c 'mkdir -p $DATA_DIR && alembic upgrade head && alembic check'

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demonstration image, start it and check it answers
        run: |
          docker build --build-arg WITH_DEMO=1 --build-arg VERSION=ci -t gms-clinical-ai:ci .
          docker run -d --name gms -e APP_ENV=demo -e APP_SECRET_KEY=$(openssl rand -hex 24) -p 8000:8000 gms-clinical-ai:ci
          for i in $(seq 1 40); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/health
          docker exec gms python -m app.cli doctor || true
          docker exec gms python -m app.cli clinical-selftest
      - name: Browser end-to-end tests against the container
        run: |
          docker exec gms python -m app.devtools.mock_ai --host 127.0.0.1 --port 9100 & sleep 3
          docker exec gms python -m app.seed use-mock-ai http://127.0.0.1:9100/v1
          docker exec gms python -m app.seed demo
          cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8000 E2E_ADMIN_EMAIL=admin@lifecaremedico.in E2E_ADMIN_PASSWORD=Admin@2026 npx playwright test
      - if: failure()
        run: docker logs gms | tail -100

  bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-bundle.sh
      - uses: actions/upload-artifact@v4
        with: { name: delivery-bundle, path: "dist/*.tar.gz*" }
