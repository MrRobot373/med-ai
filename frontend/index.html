<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/brand-mark.webp" />
    <meta name="theme-color" content="#246BFD" />
    <title>GMS Clinical AI</title>
    <script>
      // Apply the last-used theme before first paint (no flash of the wrong theme).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("gms.appearance") || "{}");
          var dark = p.theme === "dark" || (p.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
